[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "langid-32"
version = "0.1.0"
description = "Reproducible 32-language language-identification experiments"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "langid-32 contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
train = ["torch>=2.2"]

[project.scripts]
langid32-prepare = "langid32.corpus:main"
langid32-cv-inventory = "langid32.common_voice_inventory:main"
langid32-cv-extract = "langid32.common_voice_extract:main"
langid32-tatoeba-inventory = "langid32.tatoeba_inventory:main"
langid32-maalfrid-inventory = "langid32.maalfrid_inventory:main"
langid32-korean-law-inventory = "langid32.korean_law_inventory:main"
langid32-train = "langid32.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
