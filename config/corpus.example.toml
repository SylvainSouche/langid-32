# Example only. Pass equivalent column names to langid32-prepare.
# Keep raw source files outside Git (data/raw/ is ignored).
#
# Common Voice's exact TSV schema depends on the release/file. Inspect the
# downloaded file header rather than assuming a fixed schema.
# For a locale-specific file without a language column, pass --language fr.
# If there is no document ID, using the sentence text as the group column
# keeps identical prompts together across splits:
#
#   --text-column sentence --group-column sentence --language fr
#
[source]
name = "common-voice"
release = "FILL_IN_FROM_MDC"
licence = "CC0-1.0"
download_origin = "https://datacollective.mozillafoundation.org/"
