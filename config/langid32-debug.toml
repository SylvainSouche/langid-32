# langid-32 corpus policy — single operational source of numeric rules.
# Per-language and per-source overrides belong in the *_overrides tables below.
# A missing override inherits the corresponding default. Do not copy numeric
# policy values into workflows or scripts; load this file through langid32.settings.
schema_version = 1

[profile]
name = "debug"
first_pass_target_per_source_language = 200
final_sentences_per_language = 350

[project]
languages = ["bg","hr","cs","da","nl","en","et","fi","fr","de","el","hu","ga","it","lv","lt","mt","pl","pt","ro","sk","sl","es","sv","nb","nn","ru","ja","zh","ko","ar","tr","ca","is"]

# Explicitly approved immutable historical source snapshots. These are the only
# prior-run artifacts allowed as inputs to a clean staged pipeline execution.
[historical_snapshots.v5]
run_id = 43950037392
artifact_id = 14266897039
artifact_name = "multisource-candidate-v5-fineweb-en"
expires_at = "2026-11-30T20:30:01Z"
filename = "records.jsonl"

[historical_snapshots.leipzig]
run_id = 44361364340
artifact_id = 14454427333
artifact_name = "leipzig-balanced-34-44361364340"
expires_at = "2026-12-18T17:46:23Z"
filename = "leipzig-candidates.jsonl"

[historical_snapshots.tatoeba]
run_id = 44121162591
artifact_id = 14345216923
artifact_name = "tatoeba-cc0-staged-weekly-2026-11-14"
expires_at = "2026-12-01T16:03:33Z"
