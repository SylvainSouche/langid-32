name: Inspect GitHub Actions runner filesystem

on:
  workflow_dispatch:
  push:
    paths:
      - "docs/trigger-runner-inspection.txt"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect runner and workspace (read-only)
        shell: bash
        run: |
          set -euxo pipefail
          echo "=== UTC time ==="
          date -u
          echo "=== Runner identity ==="
          uname -a
          cat /etc/os-release
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          echo "RUNNER_TEMP=$RUNNER_TEMP"
          echo "RUNNER_TOOL_CACHE=$RUNNER_TOOL_CACHE"
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "=== Filesystem capacity ==="
          df -hT
          echo "=== Block devices ==="
          lsblk -o NAME,SIZE,TYPE,FSTYPE,MOUNTPOINTS || true
          echo "=== Inodes ==="
          df -ih
          echo "=== Workspace top-level ==="
          du -xhd1 "$GITHUB_WORKSPACE" 2>/dev/null | sort -h || true
          echo "=== Runner temp top-level ==="
          du -xhd1 "$RUNNER_TEMP" 2>/dev/null | sort -h || true
          echo "=== Tool cache top-level ==="
          du -xhd1 "$RUNNER_TOOL_CACHE" 2>/dev/null | sort -h || true
          echo "=== Workspace files ==="
          find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -printf '%s %p\n' | sort -nr | head -100
          echo "=== Memory (context only) ==="
          free -h
          echo "=== Disk inspection complete ==="
