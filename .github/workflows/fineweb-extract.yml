name: Extract bounded English FineWeb sample

on:
  push:
    paths:
      - "scripts/extract_fineweb_sample.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project package
        run: python -m pip install --no-deps -e .
      - name: Install DuckDB
        run: python -m pip install --disable-pip-version-check duckdb
      - name: Extract bounded English sample
        run: >-
          python scripts/extract_fineweb_sample.py
          --target 20000
          --shards 24
          --row-groups 4
          --min-score 0.90
          --output-dir reports/fineweb-en
      - name: Upload sample and provenance
        uses: actions/upload-artifact@v4
        with:
          name: fineweb-en-20000-v1.4.0
          path: reports/fineweb-en/
          retention-days: 14
          if-no-files-found: error
