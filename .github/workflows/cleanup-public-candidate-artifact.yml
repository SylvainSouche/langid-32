name: One-time cleanup of pre-metadata-only candidate artifact

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-public-candidate-artifact.yml"

permissions:
  actions: write
  contents: read

jobs:
  delete-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete the old text-bearing waiting-source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_id=14426168414
          endpoint="/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          if gh api "$endpoint" >/dev/null 2>&1; then
            gh api --method DELETE "$endpoint"
            echo "Deleted artifact ${artifact_id}."
          else
            echo "Artifact ${artifact_id} is already absent."
          fi
