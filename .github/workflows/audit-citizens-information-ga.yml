name: Audit Citizens Information Irish-English TMX
on:
  push:
    paths:
      - "scripts/audit_citizens_information_ga.py"
      - ".github/workflows/audit-citizens-information-ga.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve and audit public TMX distribution
        run: python scripts/audit_citizens_information_ga.py
      - name: Upload metadata-only audit
        uses: actions/upload-artifact@v4
        with:
          name: citizens-information-ga-audit-${{ github.run_id }}
          path: citizens-information-ga-audit.json
          if-no-files-found: error
          retention-days: 90
