name: Verify Arabic acquisition runtime
on:
  push:
    branches: [main]
    paths:
      - "arabic-runtime-test.trigger"
permissions:
  contents: read
concurrency:
  group: langid32-arabic-runtime-verification
  cancel-in-progress: false
jobs:
  arabic-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      LANGID32_CONFIG: config/langid32-debug.toml
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      HF_DATASETS_CACHE: ${{ github.workspace }}/.cache/huggingface/datasets
      HF_HUB_CACHE: ${{ github.workspace }}/.cache/huggingface/hub
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned streaming dependencies
        run: python -m pip install "datasets==3.3.2" "huggingface_hub==0.26.5" "pyarrow==19.0.1" fasttext-wheel
      - name: Run Arabic acquisition and verify clean process exit
        run: python stages/01-acquisition/run.py --target arabic
      - name: Remove all downloaded and candidate plaintext
        if: always()
        run: rm -rf input out .cache
