name: Probe FineWeb2 stratified row-group reads

on:
  push:
    paths:
      - "scripts/probe_fineweb2_rowgroups.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install probe dependencies
        run: python -m pip install --disable-pip-version-check pyarrow fsspec
      - name: Probe stratified reads
        run: python scripts/probe_fineweb2_rowgroups.py --output reports/fineweb2-rowgroups.json
      - uses: actions/upload-artifact@v4
        with:
          name: fineweb2-rowgroup-probe
          path: reports/fineweb2-rowgroups.json
