name: Common Voice MDC — Spanish quota check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/common-voice-mdc-download.yml"

permissions:
  contents: read

concurrency:
  group: common-voice-mdc-authorised-batches
  cancel-in-progress: false

jobs:
  spanish-quota-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # User explicitly authorised one further Spanish request to verify the
      # seven-download account limit. No other locale is requested in this run.
      - name: Single Spanish quota-check request
        env:
          MOZILLA_NONE_GMAIL: ${{ secrets.MOZILLA_NONE_GMAIL }}
        run: |
          python scripts/download_common_voice_mdc.py --output-dir /tmp/common-voice-private --locales es --max-downloads 1 --retries 0

      - name: Remove private source TSVs
        if: always()
        run: rm -rf /tmp/common-voice-private
