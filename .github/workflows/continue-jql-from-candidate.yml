name: langid-32 candidate-to-JQL continuation

on:
  push:
    branches: [main]
    paths: ["jql-continuation.trigger"]

permissions:
  actions: read
  contents: read

concurrency:
  group: langid32-jql-continuation
  cancel-in-progress: false

jobs:
  assessment:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      LANGID32_CONFIG: config/langid32.toml
      CANDIDATE_RUN_ID: "46155810241"
      ACQUISITION_RUN_ID: "46029288194"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate checkpoint key
        env:
          LANGID32_CHECKPOINT_KEY: ${{ secrets.LANGID32_CHECKPOINT_KEY }}
        run: python -c 'import os,sys; k=os.environ.get("LANGID32_CHECKPOINT_KEY",""); sys.exit(0 if len(k)>=32 else "LANGID32_CHECKPOINT_KEY is missing or shorter than 32 characters")'
      - name: Install JQL assessment preparation dependencies
        run: python -m pip install --upgrade pip -e . -r requirements-corpus.txt cryptography pyarrow
      - name: Download verified candidate checkpoint
        uses: actions/download-artifact@v4
        with:
          name: candidate-checkpoint-validation
          path: candidate-artifact
          run-id: ${{ env.CANDIDATE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore candidate checkpoint
        env:
          LANGID32_CHECKPOINT_KEY: ${{ secrets.LANGID32_CHECKPOINT_KEY }}
        run: |
          set -euo pipefail
          archive="$(find candidate-artifact -type f -name candidate.bin -print -quit)"
          test -n "$archive"
          python scripts/checkpoint.py unpack --archive "$archive"
          test -s out/candidate/records.jsonl
          echo "Disk after candidate restore:"
          df -h .
          du -sh out out/candidate out/normalized-inputs 2>/dev/null || true
      - name: Build full unsampled JQL assessment
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python stages/03-jql/run.py
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path("out/jql-assessment-full-summary.json").read_text())
          assert summary["status"] == "full_filtered_acquisition_pool", summary
          assert summary["sampling"] is False, summary
          assert summary["rows"] > 0, summary
          assert Path("out/jql-assessment-full.parquet").stat().st_size > 0
          print(json.dumps({k: summary[k] for k in ("status", "sampling", "rows", "assessment_parquet_sha256")}, indent=2))
          PY
      - name: Report JQL assessment workspace size
        if: always()
        run: |
          echo "JQL assessment disk usage:"
          df -h .
          du -sh out out/* 2>/dev/null | sort -h | tail -20 || true
      - name: Encrypt full JQL assessment and provenance
        env:
          LANGID32_CHECKPOINT_KEY: ${{ secrets.LANGID32_CHECKPOINT_KEY }}
        run: python scripts/checkpoint.py pack --include out --archive final.bin
      - uses: actions/upload-artifact@v4
        with:
          name: langid-32-jql-assessment-full-encrypted
          path: final.bin
          if-no-files-found: error
          retention-days: 30
      - name: Download exact source-run preflight manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "$ACQUISITION_RUN_ID" --repo "$GITHUB_REPOSITORY" --name langid-32-pipeline-preflight --dir source-preflight
          test -s "$(find source-preflight -name preflight-manifest.json -print -quit)"
      - name: Re-publish source-run preflight manifest for JQL provenance
        uses: actions/upload-artifact@v4
        with:
          name: langid-32-pipeline-preflight
          path: source-preflight/
          if-no-files-found: error
          retention-days: 30
      - name: Remove plaintext assessment workspace
        if: always()
        run: rm -rf out candidate-artifact source-preflight final.bin
