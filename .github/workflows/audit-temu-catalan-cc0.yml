name: Audit TeMU Catalan CC0 corpus
on:
  push:
    paths:
      - "scripts/audit_temu_catalan_cc0.py"
      - ".github/workflows/audit-temu-catalan-cc0.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit pinned upstream snapshot
        run: python scripts/audit_temu_catalan_cc0.py
      - name: Upload aggregate audit report
        uses: actions/upload-artifact@v4
        with:
          name: temu-catalan-cc0-audit-${{ github.run_id }}
          path: reports/temu-catalan-cc0-audit.json
          retention-days: 90
