name: Parallel JQL full-pool scoring and global pruning

on:
  workflow_run:
    workflows: ["langid-32 staged corpus pipeline"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful staged pipeline run ID containing the encrypted full JQL assessment"
        required: true
        type: string
      artifact_name:
        description: "Encrypted assessment artifact name"
        required: true
        type: string
        default: "langid-32-jql-assessment-full-encrypted"
      resume_ratings_run_id:
        description: "Optional previous JQL scoring workflow run whose partial shard ratings should be resumed"
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: jql-full-assessment-${{ github.event.workflow_run.id || inputs.source_run_id || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.head_sha }}
      source_run_id: ${{ steps.source.outputs.run_id }}
      config_path: ${{ steps.profile.outputs.config_path }}
      config_sha256: ${{ steps.profile.outputs.config_sha256 }}
      matrix: ${{ steps.config.outputs.matrix }}
      max_parallel: ${{ steps.config.outputs.max_parallel }}
      max_seconds: ${{ steps.config.outputs.max_seconds }}
      shard_batch_rows: ${{ steps.config.outputs.shard_batch_rows }}
      job_timeout_minutes: ${{ steps.config.outputs.job_timeout_minutes }}
      work_budget_minutes: ${{ steps.config.outputs.work_budget_minutes }}
      python_version: ${{ steps.config.outputs.python_version }}
      short_retention_days: ${{ steps.config.outputs.short_retention_days }}
      retention_days: ${{ steps.config.outputs.retention_days }}
    steps:
      - id: source
        name: Resolve and validate the exact successful staged-pipeline run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.source_run_id }}
        run: |
          set -euo pipefail
          response="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          head_sha="$(printf '%s' "$response" | jq -r '.head_sha')"
          head_branch="$(printf '%s' "$response" | jq -r '.head_branch')"
          workflow_name="$(printf '%s' "$response" | jq -r '.name')"
          status="$(printf '%s' "$response" | jq -r '.status')"
          conclusion="$(printf '%s' "$response" | jq -r '.conclusion')"
          test "$workflow_name" = "langid-32 staged corpus pipeline"
          test "$head_branch" = "main"
          test "$status" = "completed"
          test "$conclusion" = "success"
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "run_id=$SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.head_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install assessment preparation dependencies
        run: python -m pip install --upgrade pip pyarrow cryptography
      - id: profile
        name: Bind JQL to the exact source run configuration
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p source-preflight
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name langid-32-pipeline-preflight --dir source-preflight
          manifest="$(find source-preflight -name preflight-manifest.json -print -quit)"
          test -n "$manifest"
          config_path="$(jq -r '.config_path' "$manifest")"
          config_sha256="$(jq -r '.policy_hashes.config_sha256' "$manifest")"
          profile="$(jq -r '.profile' "$manifest")"
          if [[ "$profile" == "debug" ]]; then
            test "$config_path" = "config/langid32-debug.toml"
          elif [[ "$profile" == "release" ]]; then
            test "$config_path" = "config/langid32.toml"
          else
            echo "Unknown source-run profile: $profile" >&2
            exit 1
          fi
          test -n "$config_path"
          test -f "$config_path"
          actual_sha256="$(sha256sum "$config_path" | cut -d ' ' -f 1)"
          test "$actual_sha256" = "$config_sha256"
          echo "config_path=$config_path" >> "$GITHUB_OUTPUT"
          echo "config_sha256=$config_sha256" >> "$GITHUB_OUTPUT"
          echo "LANGID32_CONFIG=$config_path" >> "$GITHUB_ENV"
      - id: config
        name: Read authoritative JQL shard configuration
        run: python scripts/emit_jql_matrix.py
      - name: Download and decrypt full assessment from the exact source run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          ARTIFACT_NAME: ${{ inputs.artifact_name || 'langid-32-jql-assessment-full-encrypted' }}
          LANGID32_CHECKPOINT_KEY: ${{ secrets.LANGID32_CHECKPOINT_KEY }}
          JQL_SHARD_BATCH_ROWS: ${{ steps.config.outputs.shard_batch_rows }}
        run: |
          set -euo pipefail
          mkdir -p source stage jql-work/out quality
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir source
          archive="$(find source -type f -name final.bin -print -quit)"
          test -n "$archive"
          python scripts/checkpoint.py unpack --root stage --archive "$archive"
          test -s stage/out/jql-assessment-full.parquet
          cp stage/out/jql-assessment-full.parquet jql-work/out/jql-assessment-full.parquet
          python scripts/split_jql_parquet.py \
            --input jql-work/out/jql-assessment-full.parquet \
            --output-dir jql-work/out/jql-shards \
            --batch-rows "$JQL_SHARD_BATCH_ROWS" \
            --config "$LANGID32_CONFIG"
          python scripts/check_sentence_boundaries.py \
            --input jql-work/out/jql-assessment-full.parquet \
            --output quality/sentence-boundary-flags.csv
          python scripts/checkpoint.py pack --root jql-work --archive jql-shards.bin
      - name: Upload encrypted assessment and shards
        uses: actions/upload-artifact@v4
        with:
          name: jql-shards-encrypted
          path: jql-shards.bin
          if-no-files-found: error
          retention-days: ${{ steps.config.outputs.short_retention_days }}
      - name: Upload non-text sentence-boundary diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: jql-quality-flags
          path: quality/sentence-boundary-flags.csv
          if-no-files-found: error
          retention-days: ${{ steps.config.outputs.short_retention_days }}
      - name: Remove plaintext assessment workspaces
        if: always()
        run: rm -rf source stage jql-work quality jql-shards.bin

  score:
    needs: prepare
    name: Score shard ${{ matrix.index }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.prepare.outputs.job_timeout_minutes) }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.prepare.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      LANGID32_CONFIG: ${{ needs.prepare.outputs.config_path }}
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      HF_HUB_DISABLE_TELEMETRY: "1"
      JQL_MAX_SECONDS: ${{ needs.prepare.outputs.max_seconds }}
      JQL_WORK_BUDGET_MINUTES: ${{ needs.prepare.outputs.work_budget_minutes }}
      LANGID32_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      LANGID32_SOURCE_RUN_ID: ${{ needs.prepare.outputs.source_run_id }}
    steps:
      - id: job_clock
        name: Start the shard work-budget clock before setup
        run: echo "started_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.prepare.outputs.python_version }}
          cache: pip
      - name: Restore Hugging Face model cache
        uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: jql-hf-${{ runner.os }}-arctic-v2-heads-v1
      - name: Install CPU-only inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-jql.txt cryptography
      - uses: actions/download-artifact@v4
        with:
          name: jql-shards-encrypted
          path: encrypted
      - name: Restore encrypted shard set
        env:
          LANGID32_CHECKPOINT_KEY: ${{ secrets.LANGID32_CHECKPOINT_KEY }}
        run: python scripts/checkpoint.py unpack --root jql-work --archive encrypted/jql-shards.bin
      - name: Restore partial ratings from a previous scoring run when requested
        if: ${{ inputs.resume_ratings_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN_ID: ${{ inputs.resume_ratings_run_id }}
          SHARD_INDEX: ${{ matrix.index }}
        run: |
          mkdir -p previous ratings
          if gh run download "$RESUME_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "jql-ratings-$SHARD_INDEX" --dir previous; then
            find previous -type f -name "shard-$SHARD_INDEX.csv*" -exec cp {} ratings/ \;
          else
            echo "No previous partial artifact for shard $SHARD_INDEX; starting that shard from scratch."
          fi
      - name: Score all three JQL heads in resumable one-hour batches
        env:
          JQL_JOB_STARTED_EPOCH: ${{ steps.job_clock.outputs.started_epoch }}
        run: |
          set +e
          output="ratings/shard-${{ matrix.index }}.csv"
          mkdir -p ratings
          while true; do
            now=$(date +%s)
            elapsed=$((now - JQL_JOB_STARTED_EPOCH))
            remaining=$((JQL_WORK_BUDGET_MINUTES * 60 - elapsed))
            # Leave one inference mini-batch for orderly checkpointing, plus the
            # separately configured ten-minute artifact-upload reserve.
            if (( remaining <= 60 )); then
              echo "Shard work budget exhausted; preserving partial ratings."
              exit 76
            fi
            invocation_budget=$((remaining - 60))
            python scripts/score_jql_parquet.py \
              --input "jql-work/out/jql-shards/${{ matrix.file }}" \
              --output "$output" \
              --device cpu \
              --config "$LANGID32_CONFIG" \
              --max-seconds "$JQL_MAX_SECONDS" \
              --max-runtime-seconds "$invocation_budget" \
              --resume
            status=$?
            if [ "$status" -eq 0 ]; then
              exit 0
            elif [ "$status" -eq 75 ]; then
              continue
            else
              exit "$status"
            fi
          done
      - name: Upload shard ratings, including partial diagnostics on failure
        if: always() && hashFiles('ratings/*.csv') != ''
        uses: actions/upload-artifact@v4
        with:
          name: jql-ratings-${{ matrix.index }}
          path: ratings/
          if-no-files-found: error
          retention-days: ${{ needs.prepare.outputs.short_retention_days }}
          overwrite: true
      - name: Remove plaintext shard workspace
        if: always()
        run: rm -rf jql-work encrypted previous ratings

  merge:
    needs: [prepare, score]
    runs-on: ubuntu-latest
    env:
      LANGID32_CONFIG: ${{ needs.prepare.outputs.config_path }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.prepare.outputs.python_version }}
          cache: pip
      - name: Install merge and encryption dependencies
        run: python -m pip install --upgrade pip pyarrow pandas cryptography
      - uses: actions/download-artifact@v4
        with:
          name: jql-shards-encrypted
          path: encrypted
      - uses: actions/download-artifact@v4
        with:
          pattern: jql-ratings-*
          path: ratings
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: jql-quality-flags
          path: quality
      - name: Restore assessment and validate complete three-judge coverage
        env:
          LANGID32_CHECKPOINT_KEY: ${{ secrets.LANGID32_CHECKPOINT_KEY }}
        run: python scripts/checkpoint.py unpack --root jql-work --archive encrypted/jql-shards.bin
      - name: Normalize, calculate consensus and prune the global bottom quarter
        env:
          LANGID32_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          LANGID32_SOURCE_RUN_ID: ${{ needs.prepare.outputs.source_run_id }}
        run: |
          mkdir -p results result-work/out
          python scripts/merge_jql_ratings.py \
            --input jql-work/out/jql-assessment-full.parquet \
            --ratings-dir ratings \
            --quality quality/sentence-boundary-flags.csv \
            --shards-dir jql-work/out/jql-shards \
            --output-csv results/jql-consensus-full.csv \
            --output-parquet results/jql-consensus-full.parquet \
            --summary results/jql-consensus-full-summary.json \
            --include-text \
            --pruned-output-csv results/jql-consensus-pruned.csv \
            --pruned-output-parquet results/jql-consensus-pruned.parquet \
            --pruning-summary results/jql-pruning-summary.json \
            --config "$LANGID32_CONFIG"
          cp jql-work/out/jql-assessment-full.parquet result-work/out/
          cp -R results/. result-work/out/
      - name: Encrypt full and pruned JQL outputs
        env:
          LANGID32_CHECKPOINT_KEY: ${{ secrets.LANGID32_CHECKPOINT_KEY }}
        run: python scripts/checkpoint.py pack --root result-work --archive jql-pruned-pool.bin
      - name: Upload encrypted full and pruned JQL outputs
        uses: actions/upload-artifact@v4
        with:
          name: langid-32-jql-pruned-pool-encrypted
          path: jql-pruned-pool.bin
          if-no-files-found: error
          retention-days: ${{ needs.prepare.outputs.retention_days }}
      - name: Remove plaintext scoring and merge workspaces
        if: always()
        run: rm -rf jql-work encrypted ratings quality results result-work jql-pruned-pool.bin
