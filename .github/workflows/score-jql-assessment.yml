name: Parallel JQL assessment and sentence-quality workflow

on:
  workflow_run:
    workflows: ["Build candidate corpus and JQL assessment"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Run ID containing the JQL assessment Parquet artifact"
        required: false
        type: string
      artifact_name:
        description: "Assessment artifact name"
        required: true
        type: string
        default: "langid-32-jql-assessment-full"

permissions:
  actions: read
  contents: read

concurrency:
  group: jql-full-assessment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.config.outputs.matrix }}
      max_parallel: ${{ steps.config.outputs.max_parallel }}
      python_version: ${{ steps.config.outputs.python_version }}
      short_retention_days: ${{ steps.config.outputs.short_retention_days }}
      retention_days: ${{ steps.config.outputs.retention_days }}
    steps:
      - uses: actions/checkout@v4
      - id: config
        run: python3 scripts/emit_jql_matrix.py

  score:
    needs: prepare
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    name: Score shard ${{ matrix.index }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.prepare.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.prepare.outputs.python_version }}
          cache: pip
      - name: Restore Hugging Face model cache
        uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: jql-hf-${{ runner.os }}-arctic-v2-heads-v1
      - name: Install CPU-only inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-jql.txt pyarrow pandas
      - name: Download and locally split source assessment
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.source_run_id }}
          ARTIFACT_NAME: ${{ inputs.artifact_name || 'langid-32-jql-assessment-full' }}
        run: |
          mkdir -p input shards
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir input
          mapfile -t parquet_files < <(find input -type f -name '*.parquet' -print)
          if [ "${#parquet_files[@]}" -ne 1 ]; then
            echo "Expected exactly one Parquet file; found ${#parquet_files[@]}"
            find input -maxdepth 4 -type f -print
            exit 1
          fi
          cp "${parquet_files[0]}" assessment.parquet
          python scripts/split_jql_parquet.py --input assessment.parquet --output-dir shards --config config/langid32.toml
      - name: Score all three JQL heads for this shard
        run: |
          mkdir -p ratings
          python scripts/score_jql_parquet.py \
            --input "shards/${{ matrix.file }}" \
            --output "ratings/shard-${{ matrix.index }}.csv" \
            --device cpu \
            --config config/langid32.toml
      - name: Upload shard ratings
        uses: actions/upload-artifact@v4
        with:
          name: jql-ratings-${{ matrix.index }}
          path: ratings/shard-${{ matrix.index }}.csv
          if-no-files-found: error
          retention-days: ${{ needs.prepare.outputs.short_retention_days }}

  boundary:
    needs: prepare
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    name: Sentence-boundary checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.prepare.outputs.python_version }}
          cache: pip
      - name: Install boundary-check dependency
        run: python -m pip install --upgrade pip pyarrow
      - name: Download source assessment
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.source_run_id }}
          ARTIFACT_NAME: ${{ inputs.artifact_name || 'langid-32-jql-assessment-full' }}
        run: |
          mkdir -p input
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir input
          mapfile -t parquet_files < <(find input -type f -name '*.parquet' -print)
          if [ "${#parquet_files[@]}" -ne 1 ]; then
            echo "Expected exactly one Parquet file; found ${#parquet_files[@]}"
            find input -maxdepth 4 -type f -print
            exit 1
          fi
          cp "${parquet_files[0]}" assessment.parquet
      - name: Check capitalization and terminal punctuation
        run: |
          mkdir -p quality
          python scripts/check_sentence_boundaries.py \
            --input assessment.parquet \
            --output quality/sentence-boundary-flags.csv
      - name: Upload sentence-quality flags
        uses: actions/upload-artifact@v4
        with:
          name: jql-quality-flags
          path: quality/sentence-boundary-flags.csv
          if-no-files-found: error
          retention-days: ${{ needs.prepare.outputs.short_retention_days }}

  merge:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    name: Normalize, prune bottom quartile and publish reports
    needs: [prepare, score, boundary]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.prepare.outputs.python_version }}
          cache: pip
      - name: Install merge dependencies
        run: python -m pip install --upgrade pip pyarrow pandas
      - name: Download source assessment for ID and language validation
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.source_run_id }}
          ARTIFACT_NAME: ${{ inputs.artifact_name || 'langid-32-jql-assessment-full' }}
        run: |
          mkdir -p input
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir input
          mapfile -t parquet_files < <(find input -type f -name '*.parquet' -print)
          if [ "${#parquet_files[@]}" -ne 1 ]; then
            echo "Expected exactly one Parquet file; found ${#parquet_files[@]}"
            find input -maxdepth 4 -type f -print
            exit 1
          fi
          cp "${parquet_files[0]}" assessment.parquet
      - name: Download all sharded ratings
        uses: actions/download-artifact@v4
        with:
          pattern: jql-ratings-*
          path: ratings
          merge-multiple: true
      - name: Download sentence-quality flags
        uses: actions/download-artifact@v4
        with:
          name: jql-quality-flags
          path: quality
      - name: Validate coverage, normalize and prune bottom quartile
        run: |
          mkdir -p out
          python scripts/merge_jql_ratings.py \
            --input assessment.parquet \
            --ratings-dir ratings \
            --quality quality/sentence-boundary-flags.csv \
            --output-csv out/jql-consensus-full.csv \
            --output-parquet out/jql-consensus-full.parquet \
            --summary out/jql-consensus-full-summary.json \
            --include-text \
            --pruned-output-csv out/jql-consensus-pruned.csv \
            --pruned-output-parquet out/jql-consensus-pruned.parquet \
            --pruning-summary out/jql-pruning-summary.json
      - name: Upload final assessment outputs
        uses: actions/upload-artifact@v4
        with:
          name: langid-32-jql-pruned-pool
          path: out/
          if-no-files-found: error
          retention-days: ${{ needs.prepare.outputs.retention_days }}
