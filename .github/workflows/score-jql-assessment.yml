name: Parallel JQL assessment and sentence-quality workflow

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Run ID containing the private JQL assessment Parquet artifact"
        required: true
        type: string
        default: "44563498916"
      artifact_name:
        description: "Assessment artifact name"
        required: true
        type: string
        default: "langid-32-jql-assessment-34k"

permissions:
  actions: read
  contents: read

concurrency:
  group: jql-assessment-\${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Fetch and split assessment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install preparation dependencies
        run: python -m pip install --upgrade pip pyarrow
      - name: Download assessment artifact from source run
        env:
          GH_TOKEN: \${{ github.token }}
          SOURCE_RUN_ID: \${{ inputs.source_run_id }}
          ARTIFACT_NAME: \${{ inputs.artifact_name }}
        run: |
          mkdir -p input
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" \
            --dir input
          mapfile -t parquet_files < <(find input -type f -name '*.parquet' -print)
          if [ "\${#parquet_files[@]}" -ne 1 ]; then
            echo "Expected exactly one Parquet file in the artifact; found \${#parquet_files[@]}"
            find input -maxdepth 4 -type f -print
            exit 1
          fi
          cp "\${parquet_files[0]}" assessment.parquet
      - name: Split into eight balanced shards
        run: |
          python scripts/split_jql_parquet.py \
            --input assessment.parquet \
            --output-dir workflow-input \
            --shards 8
          cp assessment.parquet workflow-input/assessment.parquet
      - name: Publish intermediate inputs
        uses: actions/upload-artifact@v4
        with:
          name: jql-workflow-input
          path: workflow-input/
          if-no-files-found: error
          retention-days: 2

  score:
    name: Score shard \${{ matrix.index }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { index: 0, file: shard-00.parquet }
          - { index: 1, file: shard-01.parquet }
          - { index: 2, file: shard-02.parquet }
          - { index: 3, file: shard-03.parquet }
          - { index: 4, file: shard-04.parquet }
          - { index: 5, file: shard-05.parquet }
          - { index: 6, file: shard-06.parquet }
          - { index: 7, file: shard-07.parquet }
    env:
      HF_HOME: \${{ github.workspace }}/.cache/huggingface
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Restore Hugging Face model cache
        uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: jql-hf-\${{ runner.os }}-arctic-v2-heads-v1
      - name: Install CPU-only inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-jql.txt pyarrow pandas
      - name: Download prepared shards
        uses: actions/download-artifact@v4
        with:
          name: jql-workflow-input
          path: workflow-input
      - name: Score all three JQL heads for this shard
        run: |
          mkdir -p ratings
          python scripts/score_jql_parquet.py \
            --input "workflow-input/\${{ matrix.file }}" \
            --output "ratings/shard-\${{ matrix.index }}.csv" \
            --device cpu \
            --batch-size 8 \
            --max-length 8192 \
            --torch-threads 2
      - name: Upload shard ratings
        uses: actions/upload-artifact@v4
        with:
          name: jql-ratings-\${{ matrix.index }}
          path: ratings/shard-\${{ matrix.index }}.csv
          if-no-files-found: error
          retention-days: 2

  boundary:
    name: Sentence-boundary checks
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install boundary-check dependency
        run: python -m pip install --upgrade pip pyarrow
      - name: Download assessment input
        uses: actions/download-artifact@v4
        with:
          name: jql-workflow-input
          path: workflow-input
      - name: Check capitalization and terminal punctuation
        run: |
          mkdir -p quality
          python scripts/check_sentence_boundaries.py \
            --input workflow-input/assessment.parquet \
            --output quality/sentence-boundary-flags.csv
      - name: Upload sentence-quality flags
        uses: actions/upload-artifact@v4
        with:
          name: jql-quality-flags
          path: quality/sentence-boundary-flags.csv
          if-no-files-found: error
          retention-days: 2

  merge:
    name: Normalize, calculate consensus and publish results
    needs: [score, boundary]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install merge dependencies
        run: python -m pip install --upgrade pip pyarrow pandas
      - name: Download original assessment
        uses: actions/download-artifact@v4
        with:
          name: jql-workflow-input
          path: workflow-input
      - name: Download all sharded ratings
        uses: actions/download-artifact@v4
        with:
          pattern: jql-ratings-*
          path: ratings
          merge-multiple: true
      - name: Download sentence-quality flags
        uses: actions/download-artifact@v4
        with:
          name: jql-quality-flags
          path: quality
      - name: Validate coverage, normalize and calculate consensus
        run: |
          mkdir -p out
          python scripts/merge_jql_ratings.py \
            --input workflow-input/assessment.parquet \
            --ratings-dir ratings \
            --quality quality/sentence-boundary-flags.csv \
            --output-csv out/jql-consensus-34k.csv \
            --output-parquet out/jql-consensus-34k.parquet \
            --summary out/jql-consensus-34k-summary.json
      - name: Upload final assessment outputs
        uses: actions/upload-artifact@v4
        with:
          name: langid-32-jql-consensus-34k
          path: out/
          if-no-files-found: error
          retention-days: 30
