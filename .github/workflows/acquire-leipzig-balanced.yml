name: Acquire Leipzig news + Wikipedia samples (34 labels)
on:
  push:
    paths:
      - "scripts/acquire_leipzig_balanced.py"
      - ".github/workflows/acquire-leipzig-balanced.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install acquisition dependencies
        run: python -m pip install --disable-pip-version-check requests pyarrow
      - name: Acquire one news and one Wikipedia corpus per target language
        run: python scripts/acquire_leipzig_balanced.py --out out/leipzig --quota 3000 --pause 1
      - name: Upload samples, provenance, manifests and original archives
        if: always() && hashFiles('out/leipzig/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: leipzig-balanced-34-${{ github.run_id }}
          path: out/leipzig/
          retention-days: 30
          if-no-files-found: error
