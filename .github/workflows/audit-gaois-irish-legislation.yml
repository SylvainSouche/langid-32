name: Audit Gaois Irish legislation corpus
on:
  push:
    paths:
      - "scripts/audit_gaois_irish_legislation.py"
      - "scripts/acquire_gaois_irish_legislation.py"
      - ".github/workflows/audit-gaois-irish-legislation.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTTP client
        run: python -m pip install --disable-pip-version-check requests
      - name: Download and audit all six Irish legislation TMX files
        run: python scripts/audit_gaois_irish_legislation.py
      - name: Build deterministic Irish-only preview sample
        run: |
          python scripts/acquire_gaois_irish_legislation.py --out out/candidates.jsonl
          rm -f out/candidates.jsonl
      - name: Upload audit and candidate manifests only
        uses: actions/upload-artifact@v4
        with:
          name: gaois-irish-legislation-audit-${{ github.run_id }}
          path: |
            reports/gaois-irish-legislation-tmx-audit.json
            out/manifest.json
          retention-days: 30
