name: Audit Målfrid 2026 Bokmål and Nynorsk
on:
  push:
    paths:
      - "scripts/audit_maalfrid_2026.py"
      - ".github/workflows/audit-maalfrid-2026.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTTP client
        run: python -m pip install --disable-pip-version-check requests
      - name: Download and audit complete Bokmål and Nynorsk archives
        run: python scripts/audit_maalfrid_2026.py
      - name: Upload aggregate audit report
        uses: actions/upload-artifact@v4
        with:
          name: maalfrid-2026-audit-${{ github.run_id }}
          path: reports/maalfrid-2026-audit.json
          retention-days: 90
