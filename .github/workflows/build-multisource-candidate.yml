name: Build candidate corpus and JQL assessment

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out source and merge code
        uses: actions/checkout@v4

      - id: runtime
        run: python3 scripts/emit_runtime_config.py
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.runtime.outputs.python_version }}

      - name: Download historical v5 artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 43950037392
          path: input/v5

      - name: Download balanced Leipzig news and Wikipedia sample
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 44361364340
          path: input/leipzig

      - name: Acquire HF-hosted CC0 Common Voice text in this runner
        run: |
          python scripts/download_common_voice_hf.py --output-dir input/common-voice/source
          python scripts/curate_common_voice_hf.py --input-root input/common-voice/source --output input/common-voice

      - name: Download Tatoeba CC0 artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 44121162591
          path: input/tatoeba

      - name: Download DGT-TM 2021 artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 44291075180
          path: input/dgt

      - name: Install waiting-source acquisition dependencies
        run: python -m pip install datasets huggingface_hub pyarrow fasttext-wheel

      - name: Acquire waiting sources in the same ephemeral runner
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          HF_HUB_DISABLE_XET: "1"
          HF_HUB_ENABLE_HF_TRANSFER: "0"
        run: |
          set +e
          failed=0
          for source in catalan icelandic norwegian korean fineweb2; do
            python scripts/acquire_waiting_sources.py --source "$source" --out "input/waiting/$source"
            rc=$?
            if [ "$rc" -ne 0 ]; then failed=1; echo "::error::Source group $source failed with exit $rc"; fi
          done
          exit "$failed"

      - name: Acquire and deduplicate CC BY 4.0 Gaois Irish legislation sample
        run: python scripts/acquire_gaois_irish_legislation.py --out input/waiting/irish/candidates.jsonl

      - name: Build candidate pool using central quotas and source-balance policy
        env:
          PYTHONPATH: src
        run: |
          python scripts/build_multisource_candidate.py \
            --v5-dir input/v5 \
            --common-voice-dir input/common-voice \
            --leipzig-dir input/leipzig \
            --tatoeba-dir input/tatoeba \
            --dgt-dir input/dgt \
            --waiting-dir input/waiting \
            --output out \
            --require-exact-counts

      - name: Build full-corpus JQL assessment Parquet
        run: |
          python scripts/sample_jql_assessment.py \
            --input out/candidate/records.jsonl \
            --output out/jql-assessment-full.parquet \
            --summary out/jql-assessment-full-summary.json \
            --all

      - name: Remove all candidate text and downloaded source data from runner workspace
        if: always()
        run: |
          rm -rf input
          rm -rf out/normalized-inputs out/all-source-inputs.jsonl
          rm -f out/candidate/train.jsonl out/candidate/validation.jsonl \
            out/candidate/test.jsonl out/candidate/reserve.jsonl \
            out/candidate/records.jsonl

      - name: Upload metadata and the full JQL assessment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: langid-32-jql-assessment-full
          path: |
            out/input-manifest.json
            out/build-summary.json
            out/candidate/manifest.json
            out/jql-assessment-full.parquet
            out/jql-assessment-full-summary.json
          if-no-files-found: warn
          retention-days: ${{ steps.runtime.outputs.artifact_retention_days }}
