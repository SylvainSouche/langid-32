name: Validate candidate construction from prior acquisition

on:
  push:
    branches: [main]
    paths: ["candidate-validation.trigger"]

permissions:
  actions: read
  contents: read

concurrency:
  group: langid32-candidate-validation
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      LANGID32_CONFIG: config/langid32.toml
      SOURCE_RUN_ID: "46029288194"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: runtime
        run: python3 scripts/emit_runtime_config.py
      - name: Validate checkpoint key before restore
        env:
          LANGID32_CHECKPOINT_KEY: ${{ secrets.LANGID32_CHECKPOINT_KEY }}
        run: python -c 'import os,sys; k=os.environ.get("LANGID32_CHECKPOINT_KEY",""); sys.exit(0 if len(k)>=32 else "LANGID32_CHECKPOINT_KEY is missing or shorter than 32 characters")'
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ steps.runtime.outputs.python_version }}"
      - name: Install candidate-stage dependencies
        run: python -m pip install -e . -r requirements-corpus.txt cryptography
      - name: Download encrypted acquisition artifacts from source run
        uses: actions/download-artifact@v4
        with:
          pattern: acquisition-*
          path: checkpoints
          merge-multiple: false
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore acquisition checkpoints
        env:
          LANGID32_CHECKPOINT_KEY: ${{ secrets.LANGID32_CHECKPOINT_KEY }}
        run: |
          set -euo pipefail
          mapfile -d '' archives < <(find checkpoints -name checkpoint.bin -print0)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "No acquisition checkpoint.bin artifacts were downloaded" >&2
            exit 1
          fi
          for archive in "${archives[@]}"; do
            python scripts/checkpoint.py unpack --archive "$archive"
          done
          echo "Disk after restore:"
          df -h .
          du -sh input out checkpoints 2>/dev/null || true
          # The acquisition artifacts remain stored on the source run; their local encrypted copies are redundant.
          rm -rf checkpoints
          echo "Disk after removing redundant encrypted downloads:"
          df -h .
          du -sh input out 2>/dev/null || true
      - name: Disk usage before candidate construction
        run: df -h . && du -sh input out 2>/dev/null || true
      - name: Build candidate corpus
        env:
          PYTHONPATH: src
          PYTHONUNBUFFERED: "1"
        run: python stages/02-candidate/run.py
      - name: Report candidate workspace size
        if: always()
        run: |
          echo "Candidate workspace disk usage:"
          df -h .
          du -sh input out 2>/dev/null || true
          du -sh out/* 2>/dev/null | sort -h | tail -20 || true
      - name: Encrypt candidate checkpoint (JQL inputs and candidate provenance only)
        if: always() && success()
        env:
          LANGID32_CHECKPOINT_KEY: ${{ secrets.LANGID32_CHECKPOINT_KEY }}
        run: python scripts/checkpoint.py pack --include out --archive candidate.bin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-checkpoint-validation
          path: candidate.bin
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove plaintext working files
        if: always()
        run: rm -rf input out checkpoints candidate.bin
