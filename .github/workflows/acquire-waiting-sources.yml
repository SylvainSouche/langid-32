name: Acquire and curate waiting language sources
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      HF_DATASETS_CACHE: ${{ github.workspace }}/.cache/huggingface/datasets
      HF_HUB_CACHE: ${{ github.workspace }}/.cache/huggingface/hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install streaming dataset dependencies
        run: python -m pip install datasets==3.3.2 huggingface_hub==0.26.5 pyarrow==19.0.1 fasttext-wheel
      - name: Acquire and curate all identified source groups
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          set +e
          failed=0
          for source in catalan icelandic norwegian korean fineweb2 arabic; do
            python scripts/acquire_waiting_sources.py --source "$source" --out "out/$source"
            rc=$?
            if [ "$rc" -ne 0 ]; then failed=1; echo "::error::Source group $source failed with exit $rc"; fi
          done
          exit "$failed"
      - name: Upload metadata manifests only (public repository; do not persist candidate text)
        if: always() && hashFiles('out/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: waiting-sources-curated-${{ github.run_id }}
          path: out/*/manifest.json
          retention-days: 14
          if-no-files-found: warn
      - name: Remove plaintext source and candidate workspaces
        if: always()
        run: rm -rf out input .cache

# Re-run against the bounded-memory deterministic sampler revision.
