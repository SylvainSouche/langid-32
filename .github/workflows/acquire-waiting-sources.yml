name: Acquire and curate waiting language sources
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Single acquisition target"
        required: true
        type: choice
        options: [catalan, icelandic, norwegian, korean, fineweb2, arabic, gaois, common-voice, historical]
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - id: runtime
        run: python3 scripts/emit_runtime_config.py
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.runtime.outputs.python_version }}
      - name: Install source dependencies
        run: python -m pip install datasets huggingface_hub pyarrow fasttext-wheel cryptography
      - name: Acquire selected target
        env:
          LANGID32_CHECKPOINT_KEY: ${{ secrets.LANGID32_CHECKPOINT_KEY }}
        run: |
          python stages/01-acquisition/run.py --target "${{ inputs.target }}"
          python scripts/checkpoint.py pack --archive checkpoint.bin
      - uses: actions/upload-artifact@v4
        with:
          name: acquisition-${{ inputs.target }}
          path: checkpoint.bin
          retention-days: ${{ steps.runtime.outputs.checkpoint_retention_days }}
