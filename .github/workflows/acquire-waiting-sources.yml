name: Acquire and curate waiting language sources
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install streaming dataset dependencies
        run: python -m pip install datasets huggingface_hub pyarrow fasttext-wheel
      - name: Acquire one target using the staged adapter
        run: |
          python stages/01-acquisition/run.py --target "${{ inputs.target }}"
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
