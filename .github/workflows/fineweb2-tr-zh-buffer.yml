name: Top up FineWeb2 Turkish and Chinese privacy buffer

on:
  push:
    paths:
      - "scripts/extract_fineweb2_sample.py"
      - ".github/workflows/fineweb2-tr-zh-buffer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project package
        run: python -m pip install --no-deps -e .
      - name: Install DuckDB
        run: python -m pip install --disable-pip-version-check duckdb
      - name: Extract 20,100 candidates for Turkish and Chinese
        run: >-
          python scripts/extract_fineweb2_sample.py
          --languages tr zh
          --target-per-language 20100
          --shards-per-language 4
          --max-row-groups 3
          --output-dir reports/fineweb2-tr-zh-buffer
      - name: Verify complete buffer counts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("reports/fineweb2-tr-zh-buffer/manifest.json").read_text())
          expected = {"train": 16080, "validation": 2010, "test": 2010}
          for item in manifest["languages"]:
              if item.get("error"):
                  raise SystemExit(f"{item['language']}: {item['error']}")
              if item.get("selected_counts_by_split") != expected:
                  raise SystemExit(f"{item['language']}: {item.get('selected_counts_by_split')} != {expected}")
          if len(manifest["languages"]) != 2:
              raise SystemExit(f"expected 2 languages, got {len(manifest['languages'])}")
          print("Both languages have the exact 20,100 candidate split.")
          PY
      - name: Upload candidates and provenance
        uses: actions/upload-artifact@v4
        with:
          name: fineweb2-tr-zh-20100-buffer-v2.1.0
          path: reports/fineweb2-tr-zh-buffer/
          retention-days: 14
          if-no-files-found: error
