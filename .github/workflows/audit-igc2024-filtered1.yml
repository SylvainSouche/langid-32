name: Audit IGC2024 Filtered-1 Icelandic corpus
on:
  push:
    paths:
      - "scripts/audit_igc2024_filtered1.py"
      - ".github/workflows/audit-igc2024-filtered1.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTTP client
        run: python -m pip install --disable-pip-version-check requests
      - name: Download and audit complete CC BY 4.0 archive
        run: python scripts/audit_igc2024_filtered1.py
      - name: Upload aggregate audit report
        uses: actions/upload-artifact@v4
        with:
          name: igc2024-filtered1-audit-${{ github.run_id }}
          path: reports/igc2024-filtered-1-audit.json
          retention-days: 90
