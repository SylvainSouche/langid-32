name: Download Leipzig Icelandic Newscrawl 2019 300K
on:
  push:
    paths:
      - ".github/workflows/download-leipzig-isl-newscrawl-2019.yml"
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Download original Leipzig archive
        run: |
          set -euo pipefail
          url="https://downloads.wortschatz-leipzig.de/corpora/isl_newscrawl_2019_300K.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 \
            --user-agent "langid-32-corpus-acquisition/1.0" \
            "$url" -o isl_newscrawl_2019_300K.tar.gz
          gzip -t isl_newscrawl_2019_300K.tar.gz
          tar -tzf isl_newscrawl_2019_300K.tar.gz >/dev/null
          sha256sum isl_newscrawl_2019_300K.tar.gz
          ls -lh isl_newscrawl_2019_300K.tar.gz
      - name: Upload original archive
        uses: actions/upload-artifact@v4
        with:
          name: leipzig-isl-newscrawl-2019-300K
          path: isl_newscrawl_2019_300K.tar.gz
          retention-days: 30
          if-no-files-found: error
