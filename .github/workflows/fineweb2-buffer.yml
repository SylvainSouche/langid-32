name: Extract FineWeb2 privacy buffer for global corpus

on:
  push:
    paths:
      - "scripts/extract_fineweb2_sample.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project package
        run: python -m pip install --no-deps -e .
      - name: Install DuckDB
        run: python -m pip install --disable-pip-version-check duckdb
      - name: Extract 20,100 candidates per language
        run: >-
          python scripts/extract_fineweb2_sample.py
          --languages bg hr cs da nl et fi fr de el hu ga it lv lt mt pl pt ro sk sl es sv nb nn ru ja zh ko ar tr
          --target-per-language 20100
          --shards-per-language 4
          --max-row-groups 3
          --output-dir reports/fineweb2-buffer
      - name: Upload metadata manifest only (public repository; no candidate text)
        uses: actions/upload-artifact@v4
        with:
          name: fineweb2-31x20100-buffer-v2.1.0
          path: reports/fineweb2-buffer/manifest.json
          retention-days: 14
          if-no-files-found: error
