name: Common Voice 22 — Hugging Face text-only ingestion

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/common-voice-hf.yml"
      - "scripts/download_common_voice_hf.py"
      - "scripts/curate_common_voice_mdc.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: common-voice-hf-text-ingestion
  cancel-in-progress: false

jobs:
  common-voice-hf:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch only validated sentence text files (no audio)
        id: download
        continue-on-error: true
        run: |
          python scripts/download_common_voice_hf.py --output-dir /tmp/common-voice-private

      - name: Curate text-only candidates
        if: always()
        run: |
          python scripts/curate_common_voice_mdc.py --input-root /tmp/common-voice-private --output /tmp/common-voice-curated --per-language-cap 9000

      - name: Assemble text-only audit artifact
        if: always()
        run: |
          mkdir -p /tmp/common-voice-artifact
          cp /tmp/common-voice-private/hf-common-voice-download-manifest.json /tmp/common-voice-artifact/ 2>/dev/null || true
          cp /tmp/common-voice-curated/common_voice_candidates.jsonl /tmp/common-voice-artifact/ 2>/dev/null || true
          cp /tmp/common-voice-curated/common_voice_report.json /tmp/common-voice-artifact/ 2>/dev/null || true

      - name: Upload curated text and audit manifest only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: common-voice-v22-hf-curated-text
          path: /tmp/common-voice-artifact/
          if-no-files-found: warn
          retention-days: 14

      - name: Remove private source TSVs and temporary files
        if: always()
        run: |
          rm -rf /tmp/common-voice-private /tmp/common-voice-curated

      - name: Fail if any source locale failed
        if: always() && steps.download.outcome == 'failure'
        run: exit 1
