name: Common Voice mixed-source text-only ingestion

on:
  push:
    branches: [main]
    paths:
      - "scripts/download_common_voice_hf.py"
      - "scripts/curate_common_voice_mdc.py"
      - "scripts/merge_common_voice_v27_hr.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: common-voice-hf-text-ingestion
  cancel-in-progress: false

jobs:
  common-voice-hf:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch only validated sentence text files (no audio)
        id: download
        continue-on-error: true
        run: |
          python scripts/download_common_voice_hf.py --output-dir /tmp/common-voice-private --languages bg,is,ca,cs,da,nl,en,et,fi,fr,de,el,hu,ga,it,lv,lt,mt,pl,pt,ro,sk,sl,es,sv,nb,nn,ru,ja,zh,ko,ar,tr

      - name: Curate text-only candidates
        if: always()
        run: |
          python scripts/curate_common_voice_mdc.py --input-root /tmp/common-voice-private --output /tmp/common-voice-curated --per-language-cap 9000

      - name: Retrieve the previously curated Common Voice 27 Croatian subset
        uses: actions/download-artifact@v4
        with:
          name: common-voice-v27-other-accounts-curated
          path: /tmp/common-voice-v27
          run-id: 44058539144
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Replace missing HF Croatian with the retained v27 subset
        run: |
          python scripts/merge_common_voice_v27_hr.py --hf-curated /tmp/common-voice-curated --v27-artifact /tmp/common-voice-v27

      - name: Assemble text-only audit artifact
        if: always()
        run: |
          mkdir -p /tmp/common-voice-artifact
          cp /tmp/common-voice-private/hf-common-voice-download-manifest.json /tmp/common-voice-artifact/ 2>/dev/null || true
          cp /tmp/common-voice-curated/common_voice_report.json /tmp/common-voice-artifact/ 2>/dev/null || true
          cp /tmp/common-voice-curated/common_voice_v27_hr_provenance.json /tmp/common-voice-artifact/ 2>/dev/null || true

      - name: Upload metadata manifests only (public repository; no sentence text)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: common-voice-mixed-curated-text
          path: /tmp/common-voice-artifact/
          if-no-files-found: warn
          retention-days: 14

      - name: Remove private source TSVs and temporary files
        if: always()
        run: |
          rm -rf /tmp/common-voice-private /tmp/common-voice-curated /tmp/common-voice-v27

      - name: Fail if any HF source locale failed
        if: always() && steps.download.outcome == 'failure'
        run: exit 1
