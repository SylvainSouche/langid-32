name: Inspect FineWeb2 historical shards

on:
  push:
    paths:
      - "scripts/inspect_fineweb2_revisions.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect historical FineWeb2 trees
        run: python scripts/inspect_fineweb2_revisions.py --output-dir reports/fineweb2-revisions
      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: fineweb2-historical-revision-inventory
          path: reports/fineweb2-revisions/
          if-no-files-found: error
