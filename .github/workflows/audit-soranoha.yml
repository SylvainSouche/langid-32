name: Audit Soranoha Japanese public-domain corpus v0.2
on:
  push:
    paths:
      - "scripts/audit_soranoha.py"
      - ".github/workflows/audit-soranoha.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTTP client
        run: python -m pip install --disable-pip-version-check requests
      - name: Download and audit all Japanese works
        run: python scripts/audit_soranoha.py
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: soranoha-v02-audit-${{ github.run_id }}
          path: reports/soranoha-v0.2-audit.json
          retention-days: 90
