name: Integrate FineWeb2 into global corpus pipeline

on:
  push:
    paths:
      - "src/langid32/merge.py"
      - "scripts/stage_fineweb2.py"
      - "tests/test_merge.py"\n      - "pyproject.toml"
      - ".github/workflows/corpus-integrate-fineweb2.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: |
          python -m pip install --no-deps -e .
          python -m pip install pytest
      - name: Run corpus pipeline tests
        run: python -m pytest -q
      - name: Download verified FineWeb2 source artifact
        uses: actions/download-artifact@v4
        with:
          name: fineweb2-640k-v2.1.0
          path: input/fineweb2
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 43929112868
      - name: Convert FineWeb2 into source-normalized staging records
        run: python scripts/stage_fineweb2.py --input input/fineweb2 --output reports/fineweb2-staged.jsonl
      - name: Run global normalization, deduplication and split audit
        run: |
          python -m langid32.merge \
            --input reports/fineweb2-staged.jsonl \
            --output reports/fineweb2-global-candidate \
            --max-per-language 20000
      - uses: actions/upload-artifact@v4
        with:
          name: fineweb2-global-candidate-v1
          path: reports/fineweb2-global-candidate/
          retention-days: 14
          if-no-files-found: error
