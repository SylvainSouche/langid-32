name: Build global 32-language corpus candidate

on:
  push:
    paths:
      - "src/langid32/merge.py"\n      - "data/source-exclusions.jsonl"\n      - "data/source-exclusions.jsonl"
      - "src/langid32/dgt_tmx_stage.py"
      - "scripts/stage_fineweb2.py"
      - "scripts/stage_tatoeba.py"
      - "tests/test_merge.py"
      - "tests/test_dgt_tmx_stage.py"
      - "tests/test_tatoeba_stage.py"
      - "pyproject.toml"
      - ".github/workflows/corpus-integrate-fineweb2.yml"
      - ".github/workflows/dgt-tmx-ingest.yml"
      - ".github/workflows/tatoeba-ingest.yml"
      - ".github/workflows/fineweb2-buffer.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and test dependency
        run: |
          python -m pip install --no-deps -e .
          python -m pip install pytest
      - name: Run corpus tests
        run: python -m pytest -q
      - name: Download FineWeb2 20,100-per-language buffer
        uses: actions/download-artifact@v4
        with:
          name: fineweb2-31x20100-buffer-v2.1.0
          path: input/fineweb2
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 43932999222
      - name: Download Tatoeba CC0 staging
        uses: actions/download-artifact@v4
        with:
          name: tatoeba-cc0-staged-weekly-2026-11-14
          path: input/tatoeba
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 43935243979
      - name: Download DGT-TM 2021 staging
        uses: actions/download-artifact@v4
        with:
          name: dgt-tm-2021-staged-5k
          path: input/dgt-tm-2021
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 43935397129
      - name: Normalize FineWeb2
        run: python scripts/stage_fineweb2.py --input input/fineweb2 --output reports/fineweb2-staged.jsonl
      - name: Global normalization, privacy filtering, cross-source deduplication and split audit
        run: |
          python -m langid32.merge \
            --input reports/fineweb2-staged.jsonl \
            --input input/tatoeba/tatoeba-cc0-staged.jsonl \
            --input input/dgt-tm-2021/dgt-tm-2021-staged.jsonl \
            --output reports/multisource-candidate-v4-unicode-pii-clean \
            --max-per-language 20000 \
            --require-exact-counts
          cp input/fineweb2/manifest.json reports/multisource-candidate-v4-unicode-pii-clean/source-manifest-fineweb2.json
          cp input/tatoeba/tatoeba-cc0-staged.manifest.json reports/multisource-candidate-v4-unicode-pii-clean/source-manifest-tatoeba.json
          cp input/dgt-tm-2021/dgt-tm-2021-staged.manifest.json reports/multisource-candidate-v4-unicode-pii-clean/source-manifest-dgt-tm-2021.json
      - uses: actions/upload-artifact@v4
        with:
          name: multisource-candidate-v4-unicode-pii-clean
          path: reports/multisource-candidate-v4-unicode-pii-clean/
          retention-days: 14
          if-no-files-found: error
