name: Audit ParlaMint 4.0 Icelandic Slovenian Turkish
on:
  push:
    paths:
      - "scripts/audit_parlamint_4.py"
      - ".github/workflows/audit-parlamint-4.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTTP client
        run: python -m pip install --disable-pip-version-check requests
      - name: Download and audit ParlaMint 4.0 corpora
        run: python scripts/audit_parlamint_4.py
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: parlamint-4-selected-audit-${{ github.run_id }}
          path: reports/parlamint-4-selected-audit.json
          retention-days: 90
