name: Audit United Nations Parallel Corpus Arabic-English
on:
  push:
    paths:
      - "scripts/audit_un_parallel_ar_en.py"
      - ".github/workflows/audit-un-parallel-ar-en.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTTP client
        run: python -m pip install --disable-pip-version-check requests
      - name: Download and audit official UN Arabic-English archive
        run: python scripts/audit_un_parallel_ar_en.py
      - name: Upload aggregate audit report
        uses: actions/upload-artifact@v4
        with:
          name: un-parallel-ar-en-audit-${{ github.run_id }}
          path: reports/un-parallel-corpus-ar-en-audit.json
          retention-days: 90
