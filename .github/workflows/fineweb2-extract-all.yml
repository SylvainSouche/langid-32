name: LEGACY — FineWeb2 31-language sample extraction

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project package
        run: python -m pip install --no-deps -e .
      - name: Install DuckDB
        run: python -m pip install --disable-pip-version-check duckdb
      - name: Extract bounded samples
        run: >-
          python scripts/extract_fineweb2_sample.py
          --languages bg hr cs da nl et fi fr de el hu ga it lv lt mt pl pt ro sk sl es sv nb nn ru ja zh ko ar tr
          --target-per-language 20000
          --max-row-groups 8
          --output-dir reports/fineweb2-31-languages
      - name: Upload metadata manifest only (public repository; no candidate text)
        uses: actions/upload-artifact@v4
        with:
          name: fineweb2-31x20000-v2.1.0
          path: reports/fineweb2-31-languages/manifest.json
          retention-days: 7
          if-no-files-found: error
