name: JQL educational QA — one-hour Croatian + Icelandic pilot
on:
  push:
    paths:
      - "scripts/rate_jql_edu.py"
      - "scripts/acquire_leipzig_balanced.py"
      - ".github/workflows/jql-edu-hourly-pilot.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  annotate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU inference dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir requests pyarrow
          python -m pip install --disable-pip-version-check --no-cache-dir torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check --no-cache-dir transformers==4.44.2 huggingface_hub safetensors sentencepiece einops
      - name: Acquire Croatian and Icelandic Leipzig samples
        run: python scripts/acquire_leipzig_balanced.py --out out/leipzig --quota 3000 --pause 1 --labels hr,is
      - name: Assemble pilot input
        run: |
          mkdir -p out/jql
          cat out/leipzig/samples/hr-news.jsonl out/leipzig/samples/hr-wikipedia.jsonl out/leipzig/samples/is-news.jsonl out/leipzig/samples/is-wikipedia.jsonl > out/jql/hr-is-pilot.jsonl
          wc -l out/jql/hr-is-pilot.jsonl
      - name: Rate for one hour (CPU benchmark)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/rate_jql_edu.py --input out/jql/hr-is-pilot.jsonl --output out/jql/hr-is-jql.jsonl --max-seconds 3600 --batch-size 32 --max-length 512
      - name: Upload QA annotations and throughput report
        if: always() && hashFiles('out/jql/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: jql-edu-hr-is-hourly-pilot-${{ github.run_id }}
          path: |
            out/jql/hr-is-jql.jsonl
            out/jql/jql_run_summary.json
            out/jql/hr-is-pilot.jsonl
            out/leipzig/manifest.json
          retention-days: 30
          if-no-files-found: warn
