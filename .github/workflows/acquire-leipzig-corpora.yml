name: Leipzig Corpora Collection inventory and bulk audit
on:
  workflow_dispatch:
    inputs:
      max_archives_per_language:
        description: Maximum archives to download per target language
        required: true
        type: choice
        options: ["1","2","3","5"]
        default: "3"
      sample_per_archive:
        description: Candidate sentence cap used for audit metrics
        required: true
        type: choice
        options: ["30000","100000","300000"]
        default: "100000"
  push:
    paths:
      - "scripts/acquire_leipzig.py"
      - ".github/workflows/acquire-leipzig-corpora.yml"
permissions:
  contents: read
jobs:
  inventory-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parsers
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Crawl Leipzig catalogue and acquire target-language archives
        run: |
          python scripts/acquire_leipzig.py --out out/leipzig \
            --max-archives-per-language "${{ inputs.max_archives_per_language || '3' }}" \
            --sample-per-archive "${{ inputs.sample_per_archive || '100000' }}"
      - name: Upload complete audit, manifests, hashes and staged archives
        if: always() && hashFiles('out/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: leipzig-corpus-audit-${{ github.run_id }}
          path: out/leipzig/
          retention-days: 30
          if-no-files-found: warn
