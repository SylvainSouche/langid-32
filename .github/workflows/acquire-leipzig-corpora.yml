name: LEGACY — Leipzig Icelandic/Croatian pilot
on:
  workflow_dispatch:
    inputs:
      max_archives_per_language:
        description: Number of representative archives to fetch for each language
        required: true
        type: choice
        options: ["1","2","3","5"]
        default: "3"
permissions:
  contents: read
jobs:
  acquire-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Parquet reader and HTTP client
        run: python -m pip install --disable-pip-version-check requests pyarrow
      - name: Fetch and inspect Icelandic and Croatian Leipzig archives
        run: |
          python scripts/acquire_leipzig.py --out out/leipzig \
            --max-archives-per-language "${{ inputs.max_archives_per_language || '3' }}"
      - name: Upload corpus pilot with CC BY attribution
        if: always() && hashFiles('out/leipzig/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: leipzig-ic-hr-pilot-${{ github.run_id }}
          path: out/leipzig/
          retention-days: 30
          if-no-files-found: error
