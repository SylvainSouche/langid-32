name: Extract bounded FineWeb2 Spanish and Turkish samples

on:
  push:
    paths:
      - "scripts/extract_fineweb2_sample.py"
      - ".github/workflows/fineweb2-extract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install DuckDB
        run: python -m pip install --disable-pip-version-check duckdb
      - name: Extract bounded samples
        run: >-
          python scripts/extract_fineweb2_sample.py
          --languages es tr
          --target-per-language 20000
          --max-row-groups 4
          --output-dir reports/fineweb2-es-tr
      - name: Upload samples and provenance
        uses: actions/upload-artifact@v4
        with:
          name: fineweb2-es-tr-20000-v2.1.0
          path: reports/fineweb2-es-tr/
          retention-days: 7
          if-no-files-found: error
