name: Prepare Hugging Face dataset package

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prepare-hf-dataset.yml"
      - "scripts/package_hf_dataset.py"
      - "docs/huggingface-dataset-card.md"
      - "docs/huggingface-licensing.md"
  workflow_dispatch:
    inputs:
      publish:
        description: "Actually upload the prepared data to the Hugging Face dataset repository"
        required: true
        type: boolean
        default: false
      rights_review_ref:
        description: "Required review record/reference if publishing (must document clearance of every included source)"
        required: false
        type: string
      dataset_license:
        description: "Exact approved dataset licence identifier (required if publishing)"
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download the validated mixed-source pilot artifact
        uses: actions/download-artifact@v4
        with:
          name: common-voice-mixed-curated-text
          path: /tmp/langid32-input
          run-id: 44095077926
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Parquet package
        run: |
          python -m pip install --disable-pip-version-check pyarrow
          python scripts/package_hf_dataset.py --input-dir /tmp/langid32-input --output-dir /tmp/langid32-hf-dataset

      - name: Add dataset card and licensing note
        run: |
          cp docs/huggingface-dataset-card.md /tmp/langid32-hf-dataset/README.md
          cp docs/huggingface-licensing.md /tmp/langid32-hf-dataset/LICENSING.md

      - name: Upload prepared package as a GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: langid-32-hf-dataset-package
          path: /tmp/langid32-hf-dataset/
          if-no-files-found: error
          retention-days: 14

      - name: Check explicit publication gate
        if: ${{ inputs.publish }}
        env:
          RIGHTS_REVIEW_REF: ${{ inputs.rights_review_ref }}
          DATASET_LICENSE: ${{ inputs.dataset_license }}
        run: |
          test -n "$RIGHTS_REVIEW_REF" || { echo "A source-rights review reference is required."; exit 1; }
          test -n "$DATASET_LICENSE" || { echo "An approved dataset licence identifier is required."; exit 1; }
          echo "Publication requested. Confirm the cited review actually clears every source and locale."

      - name: Upload to Hugging Face
        if: ${{ inputs.publish }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DATASET_LICENSE: ${{ inputs.dataset_license }}
        run: |
          python -m pip install --disable-pip-version-check huggingface_hub
          python - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import HfApi
          root = Path("/tmp/langid32-hf-dataset")
          readme = root / "README.md"
          text = readme.read_text(encoding="utf-8")
          marker = "---\\n"
          if text.startswith(marker):
              end = text.find(marker, len(marker))
              if end >= 0:
                  front = text[len(marker):end]
                  if "license:" not in front:
                      text = marker + front + f"license: {os.environ['DATASET_LICENSE']}\\n" + marker + text[end+len(marker):]
          readme.write_text(text, encoding="utf-8")
          api = HfApi(token=os.environ["HF_TOKEN"])
          api.upload_folder(
              repo_id="SylvainSouche/langid-32",
              repo_type="dataset",
              folder_path=str(root),
              commit_message="Publish reviewed langid-32 candidate dataset",
          )
          PY
