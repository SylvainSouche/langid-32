name: Audit committed Tatoeba archives

on:
  push:
    paths:
      - "data/tatoeba/**"
      - "scripts/audit_tatoeba_archives.py"
      - ".github/workflows/audit-tatoeba-archives.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate and count Tatoeba archives
        run: python scripts/audit_tatoeba_archives.py
      - uses: actions/upload-artifact@v4
        with:
          name: tatoeba-repository-audit
          path: reports/tatoeba-repository-audit.json
          retention-days: 30
          if-no-files-found: error
