name: langid-32 acquisition repair and downstream stages
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  fineweb2:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        # Retry only the five failed configurations. Reuse the five
        # encrypted checkpoints already produced by run 45502098212.
        config:
          - isl_Latn
          - nob_Latn
          - hrv_Latn
          - fin_Latn
          - ell_Grek
    steps:
      - uses: actions/checkout@v4
      - name: Validate checkpoint key before acquisition
        env:
          LANGID32_CHECKPOINT_KEY: ${{ secrets.LANGID32_CHECKPOINT_KEY }}
        run: python -c 'import os,sys; k=os.environ.get("LANGID32_CHECKPOINT_KEY",""); sys.exit(0 if len(k)>=32 else "LANGID32_CHECKPOINT_KEY is missing or shorter than 32 characters")'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install huggingface_hub pyarrow fsspec aiohttp requests cryptography
      - name: Acquire one FineWeb-2 configuration
        run: python stages/01-acquisition/targets/fineweb2.py --config "${{ matrix.config }}"
      - name: Encrypt isolated batch checkpoint
        env:
          LANGID32_CHECKPOINT_KEY: ${{ secrets.LANGID32_CHECKPOINT_KEY }}
        run: python scripts/checkpoint.py pack --archive "fineweb2-${{ matrix.config }}.bin"
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-fineweb2-${{ matrix.config }}
          path: fineweb2-${{ matrix.config }}.bin
          retention-days: 7
  candidate:
    needs: [fineweb2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate checkpoint key before restore
        env:
          LANGID32_CHECKPOINT_KEY: ${{ secrets.LANGID32_CHECKPOINT_KEY }}
        run: python -c 'import os,sys; k=os.environ.get("LANGID32_CHECKPOINT_KEY",""); sys.exit(0 if len(k)>=32 else "LANGID32_CHECKPOINT_KEY is missing or shorter than 32 characters")'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install cryptography pyarrow
      - name: Reuse successful historical and source checkpoints
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: "45399888112"
          name: acquisition-historical
          path: checkpoints/old-historical
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: "45399888112"
          name: acquisition-common-voice
          path: checkpoints/old-common-voice
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: "45399888112"
          name: acquisition-korean
          path: checkpoints/old-korean
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: "45399888112"
          name: acquisition-gaois
          path: checkpoints/old-gaois
      - name: Reuse repaired Icelandic checkpoint from prior repair run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: "45413806910"
          name: recovery-icelandic
          path: checkpoints/repaired-icelandic
      - name: Reuse successful Catalan FineWeb-2 checkpoint
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: "45502098212"
          name: recovery-fineweb2-cat_Latn
          path: checkpoints/repaired-fineweb2
      - name: Reuse successful Arabic FineWeb-2 checkpoint
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: "45502098212"
          name: recovery-fineweb2-arb_Arab
          path: checkpoints/repaired-fineweb2
      - name: Reuse successful Nynorsk FineWeb-2 checkpoint
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: "45502098212"
          name: recovery-fineweb2-nno_Latn
          path: checkpoints/repaired-fineweb2
      - name: Reuse successful Slovenian FineWeb-2 checkpoint
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: "45502098212"
          name: recovery-fineweb2-slv_Latn
          path: checkpoints/repaired-fineweb2
      - name: Reuse successful Maltese FineWeb-2 checkpoint
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: "45502098212"
          name: recovery-fineweb2-mlt_Latn
          path: checkpoints/repaired-fineweb2
      - name: Download retried FineWeb-2 batches from this run
        uses: actions/download-artifact@v4
        with:
          pattern: recovery-fineweb2-*
          merge-multiple: true
          path: checkpoints/retried-fineweb2
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: "45413806910"
          name: recovery-norwegian
          path: checkpoints/repaired-norwegian
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: "45413806910"
          name: recovery-arabic
          path: checkpoints/repaired-arabic
      - name: Reuse corrected Catalan checkpoint from prior successful acquisition
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: "45414736117"
          name: recovery-catalan
          path: checkpoints/repaired-catalan
      - name: Restore all source checkpoints
        env:
          LANGID32_CHECKPOINT_KEY: ${{ secrets.LANGID32_CHECKPOINT_KEY }}
        run: |
          find checkpoints -name '*.bin' -print0 | while IFS= read -r -d '' f; do
            python scripts/checkpoint.py unpack --archive "$f"
          done
      - name: Re-curate preserved Common Voice raw TSVs to the 20k source quota
        run: python stages/01-acquisition/run.py --target common-voice
      - name: Build candidate corpus
        env:
          PYTHONPATH: src
        run: python stages/02-candidate/run.py
      - name: Preserve candidate failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-diagnostics
          path: out/candidate/candidate-diagnostics.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Encrypt candidate checkpoint
        env:
          LANGID32_CHECKPOINT_KEY: ${{ secrets.LANGID32_CHECKPOINT_KEY }}
        run: python scripts/checkpoint.py pack --archive candidate.bin
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-checkpoint
          path: candidate.bin
          retention-days: 7
  jql:
    needs: [candidate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate checkpoint key before restore
        env:
          LANGID32_CHECKPOINT_KEY: ${{ secrets.LANGID32_CHECKPOINT_KEY }}
        run: python -c 'import os,sys; k=os.environ.get("LANGID32_CHECKPOINT_KEY",""); sys.exit(0 if len(k)>=32 else "LANGID32_CHECKPOINT_KEY is missing or shorter than 32 characters")'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install cryptography pyarrow
      - uses: actions/download-artifact@v4
        with:
          name: candidate-checkpoint
          path: checkpoint
      - name: Restore candidate checkpoint
        env:
          LANGID32_CHECKPOINT_KEY: ${{ secrets.LANGID32_CHECKPOINT_KEY }}
        run: python scripts/checkpoint.py unpack --archive checkpoint/candidate.bin
      - run: python stages/03-jql/run.py
      - name: Encrypt final assessment
        env:
          LANGID32_CHECKPOINT_KEY: ${{ secrets.LANGID32_CHECKPOINT_KEY }}
        run: python scripts/checkpoint.py pack --archive final.bin
      - uses: actions/upload-artifact@v4
        with:
          name: langid-32-jql-assessment-full-encrypted
          path: final.bin
          retention-days: 30
