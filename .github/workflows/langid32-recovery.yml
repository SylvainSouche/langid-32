name: langid-32 acquisition repair and downstream stages
on:
  push:
    branches:
      - "recovery/fix-acquisition-20261124"
    paths:
      - "scripts/acquire_waiting_sources.py"
      - ".github/workflows/langid32-recovery.yml"
      - "stages/01-acquisition/**"
permissions:
  actions: read
  contents: read
jobs:
  repair-acquisition:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        target: [catalan]
    steps:
      - uses: actions/checkout@v4
      - name: Validate checkpoint key before acquisition
        env:
          LANGID32_CHECKPOINT_KEY: ${{ secrets.LANGID32_CHECKPOINT_KEY }}
        run: python -c 'import os,sys; k=os.environ.get("LANGID32_CHECKPOINT_KEY",""); sys.exit(0 if len(k)>=32 else "LANGID32_CHECKPOINT_KEY is missing or shorter than 32 characters")'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install datasets huggingface_hub pyarrow fasttext-wheel cryptography
      - name: Acquire repaired target
        run: python stages/01-acquisition/run.py --target "${{ matrix.target }}"
      - name: Encrypt target checkpoint
        env:
          LANGID32_CHECKPOINT_KEY: ${{ secrets.LANGID32_CHECKPOINT_KEY }}
        run: python scripts/checkpoint.py pack --archive checkpoint.bin
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-${{ matrix.target }}
          path: checkpoint.bin
          retention-days: 7
  candidate:
    needs: [repair-acquisition]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Validate checkpoint key before restore
        env:
          LANGID32_CHECKPOINT_KEY: ${{ secrets.LANGID32_CHECKPOINT_KEY }}
        run: python -c 'import os,sys; k=os.environ.get("LANGID32_CHECKPOINT_KEY",""); sys.exit(0 if len(k)>=32 else "LANGID32_CHECKPOINT_KEY is missing or shorter than 32 characters")'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install cryptography pyarrow
      - name: Reuse successful historical and source checkpoints
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: "45399888112"
          name: acquisition-historical
          path: checkpoints/old-historical
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: "45399888112"
          name: acquisition-common-voice
          path: checkpoints/old-common-voice
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: "45399888112"
          name: acquisition-korean
          path: checkpoints/old-korean
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: "45399888112"
          name: acquisition-gaois
          path: checkpoints/old-gaois
      - name: Reuse repaired Icelandic checkpoint from prior repair run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: "45413806910"
          name: recovery-icelandic
          path: checkpoints/repaired-icelandic
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: "45413806910"
          name: recovery-fineweb2
          path: checkpoints/repaired-fineweb2
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: "45413806910"
          name: recovery-norwegian
          path: checkpoints/repaired-norwegian
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: "45413806910"
          name: recovery-arabic
          path: checkpoints/repaired-arabic
      - name: Download corrected Catalan checkpoint
        uses: actions/download-artifact@v4
        with:
          name: recovery-catalan
          path: checkpoints/repaired-catalan
      - name: Restore all source checkpoints
        env:
          LANGID32_CHECKPOINT_KEY: ${{ secrets.LANGID32_CHECKPOINT_KEY }}
        run: |
          find checkpoints -name checkpoint.bin -print0 | while IFS= read -r -d '' f; do
            python scripts/checkpoint.py unpack --archive "$f"
          done
      - name: Re-curate preserved Common Voice raw TSVs to the 20k source quota
        run: python scripts/curate_common_voice_hf.py --input-root input/common-voice/source --output input/common-voice --per-language-cap 20000
      - name: Build candidate corpus
        env:
          PYTHONPATH: src
        run: python stages/02-candidate/run.py
      - name: Encrypt candidate checkpoint
        env:
          LANGID32_CHECKPOINT_KEY: ${{ secrets.LANGID32_CHECKPOINT_KEY }}
        run: python scripts/checkpoint.py pack --archive candidate.bin
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-checkpoint
          path: candidate.bin
          retention-days: 7
  jql:
    needs: [candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Validate checkpoint key before restore
        env:
          LANGID32_CHECKPOINT_KEY: ${{ secrets.LANGID32_CHECKPOINT_KEY }}
        run: python -c 'import os,sys; k=os.environ.get("LANGID32_CHECKPOINT_KEY",""); sys.exit(0 if len(k)>=32 else "LANGID32_CHECKPOINT_KEY is missing or shorter than 32 characters")'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install cryptography pyarrow
      - uses: actions/download-artifact@v4
        with:
          name: candidate-checkpoint
          path: checkpoint
      - name: Restore candidate checkpoint
        env:
          LANGID32_CHECKPOINT_KEY: ${{ secrets.LANGID32_CHECKPOINT_KEY }}
        run: python scripts/checkpoint.py unpack --archive checkpoint/candidate.bin
      - run: python stages/03-jql/run.py
      - name: Encrypt final assessment
        env:
          LANGID32_CHECKPOINT_KEY: ${{ secrets.LANGID32_CHECKPOINT_KEY }}
        run: python scripts/checkpoint.py pack --archive final.bin
      - uses: actions/upload-artifact@v4
        with:
          name: langid-32-jql-assessment-full-encrypted
          path: final.bin
          retention-days: 30
