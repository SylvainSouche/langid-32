name: Audit full UN Arabic-English HF derivative
on:
  push:
    paths:
      - "scripts/audit_un_arabic_english_filtered.py"
      - ".github/workflows/audit-un-arabic-english-filtered.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Parquet reader and HTTP client
        run: python -m pip install --disable-pip-version-check requests pyarrow
      - name: Download and audit every train/dev/test shard
        run: python scripts/audit_un_arabic_english_filtered.py
      - name: Upload full audit report
        uses: actions/upload-artifact@v4
        with:
          name: un-arabic-english-filtered-audit-${{ github.run_id }}
          path: reports/un-arabic-english-filtered-full-audit.json
          retention-days: 90
