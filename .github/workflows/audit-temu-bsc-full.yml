name: Full TeMU-BSC Catalan CC0 constituent audit
on:
  push:
    paths:
      - "scripts/audit_temu_bsc_full.py"
      - ".github/workflows/audit-temu-bsc-full.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTTP client
        run: python -m pip install --disable-pip-version-check requests
      - name: Download and audit complete repository inventory
        run: python scripts/audit_temu_bsc_full.py
      - name: Upload full audit report
        uses: actions/upload-artifact@v4
        with:
          name: temu-bsc-full-audit-${{ github.run_id }}
          path: reports/temu-bsc-catalan-cc0-full-audit.json
          retention-days: 90
