name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: langid32-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and test dependency
        run: python -m pip install -e ".[dev]"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile pipeline scripts
        run: python -m compileall -q scripts
      - name: Validate Make dependency graph
        run: |
          make -n all
          make -n all LABELS=hr,is
      - name: Run tests
        run: python -m pytest -q
