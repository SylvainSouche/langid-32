name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and data-pipeline test dependencies
        run: |
          python -m pip install -e ".[train,dev]"
          python -m pip install pyarrow pandas
      - name: Lint GitHub Actions workflow syntax
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz | tar -xz -C /tmp actionlint
          /tmp/actionlint .github/workflows/*.yml
      - name: Compile pipeline scripts
        run: python -m compileall -q scripts
      - name: Validate Make dependency graph
        run: |
          make -n all
          make -n all LABELS=hr,is
      - name: Run tests
        run: python -m pytest -q
